<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños Natasha!</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: transparent; /* Transparente para dejar ver el carrusel de GIFs del fondo */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #4a4a4a;
            padding: 15px;           
            overflow: hidden; /* Evita scrolls no deseados en móviles */
        }

        /* --- Carrusel de GIFs para el fondo (Optimizado y sin parpadeo) --- */
        .background-carousel-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background-color: #000; /* Fondo negro de respaldo por si un GIF tarda en cargar */
        }

        .background-carousel-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            /* 15 segundos en total (5s por cada una de las 3 imágenes) */
            animation: fadeSlide 15s infinite; 
        }

        .background-carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Sincronización perfecta para 3 elementos */
        .background-carousel-slide:nth-child(1) { animation-delay: 0s; }
        .background-carousel-slide:nth-child(2) { animation-delay: 5s; }
        .background-carousel-slide:nth-child(3) { animation-delay: 10s; }

        /* Nueva animación con solapamiento para evitar el flash blanco */
        @keyframes fadeSlide {
            0% { opacity: 0; }
            8% { opacity: 1; }   /* Entra suavemente */
            33% { opacity: 1; }  /* Se mantiene visible */
            41% { opacity: 0; }  /* Sale suavemente antes del corte */
            100% { opacity: 0; }
        }

        .card {
            background: rgba(255, 255, 255, 0.85); /* Ligeramente más opaca para destacar sobre los GIFs */
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(216, 27, 96, 0.4);
            text-align: center;
            max-width: 380px;
            width: 100%;
            animation: fadeIn 1.5s ease-in-out;
            margin: 0 auto 20px auto;
            z-index: 10; /* Asegura que la tarjeta esté por encima del fondo */
        }

        h1 {
            color: #d81b60;
            font-size: 22px;
            margin-bottom: 15px;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.9), 0 0 12px rgba(255, 255, 255, 0.8);
        }

        p {
            font-size: 14px;
            line-height: 1.6;
            color: #222;
            margin-bottom: 20px;
        }

        .signature {
            font-weight: 600;
            color: #c2185b;
            font-size: 18px;
            display: inline-block;
            width: 80%;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.9), 0 0 12px rgba(255, 255, 255, 0.6);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Barra de música inferior --- */
        .music-player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to right, #d81b60, #ff4081);
            padding: 10px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .music-content {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 500px;
            width: 100%;
            justify-content: center;
        }

        .music-label {
            color: white;
            font-size: 13px;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        audio {
            height: 35px;
            outline: none;
            border-radius: 20px;
            background-color: #fff;
        }

        #fireworks-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5; /* Por encima del carrusel de fondo y por debajo de la tarjeta */
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Carrusel de GIFs animados para el fondo -->
    <div class="background-carousel-container">
        <div class="background-carousel-slide">
            <img src="https://i.pinimg.com/736x/72/18/a4/7218a478e8ad371bac83082c10844bb6.jpg" alt="Fondo Animado 1">
        </div>
        <div class="background-carousel-slide">
            <img src="https://i.pinimg.com/control1/1200x/72/7c/7e/727c7e185a098f893bc5b3d22ee065c5.jpg">
        </div>
        <div class="background-carousel-slide">
            <img src="https://i.pinimg.com/originals/be/91/87/be9187cda779138b4de6381e259e5630.png" alt="Fondo Animado 3">
        </div>
    </div>

    <!-- Contenedor para los fuegos artificiales -->
    <div id="fireworks-container"></div>

    <div class="card">
        <h1>¡Feliz Cumple Natasha!</h1>
      
        <p>
            ¡Espero que seas feliz! 
            <br><br>
            Que tu día esté lleno de alegría, sorpresas y mucho amor, rodeada de las personas que te quieren. Al igual que Nezuko, tienes una fortaleza y una dulzura que te hacen única.
        </p>
        
        <div style="text-align: center; color: #ff80ab; font-size: 14px; margin: 15px 0;">🌸🌸🌸🌸🌸</div>
        
        <div class="signature">
            Ema
        </div>
    </div>

    <!-- Barra de música inferior -->
    <div class="music-player-bar">
        <div class="music-content">
            <span class="music-label">🎵Play:</span>
            <audio id="cancion" controls>
                <source src="Cumple Natasha.mp3" type="audio/mpeg">
                Tu navegador no soporta el elemento de audio.
            </audio>
        </div>
    </div>

    <script src="https://unpkg.com/fireworks-js/dist/index.umd.js"></script>
    <script>
        const container = document.getElementById('fireworks-container');
        const fireworks = new Fireworks.default(container, {
            hue: { min: 300, max: 350 },
            acceleration: 1.05,
            brightness: { min: 50, max: 100 },
            particles: 60,
            trace: 4,
            explosion: 6
        });
        fireworks.start();
    </script>
</body>
</html>
